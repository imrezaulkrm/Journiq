stages:
  - analyze
  - test
  - sonar
  - build
  - deploy
  - trigger_argo
  - notify

# ════════════════════════════════════════════════════
# MR OPEN হলে → analyze + test + sonar
# সব pass হলে merge button unlock হবে
# ════════════════════════════════════════════════════

flutter-analyze:
  stage: analyze
  image: ghcr.io/cirruslabs/flutter:stable
  resource_group: android-dev-analyze
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || true
        }

        flutter pub get || { send_notification "Analyze Failure" "pub get failed 😱"; exit 1; }
        flutter analyze || { send_notification "Analyze Failure" "Who broke the code? 🔍"; exit 1; }
        dart format --check . || { send_notification "Analyze Failure" "Format check failed 🧹"; exit 1; }
      EOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_APPROVED != "true"'
      when: always
    - when: never
  tags:
    - dev

flutter-test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  resource_group: android-dev-test
  needs: ['flutter-analyze']
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || true
        }

        flutter pub get
        flutter test --coverage || { send_notification "Test Failure" "Tests are failing! 🧪"; exit 1; }
      EOF
  artifacts:
    paths:
      - coverage/lcov.info
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_APPROVED != "true"'
      when: always
    - when: never
  tags:
    - dev

sonarqube-report:
  stage: sonar
  image: registry.cloudaes.com/base-images/sonar-node24:v1
  resource_group: android-dev-sonar
  needs: ['flutter-test']
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || true
        }

        export SONAR_PROJECT_KEY=android-app-dev
        export SONAR_PROJECT_NAME="Android App Dev"

        git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-dev}" --depth=100 || \
          git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-dev}" --unshallow || true

        sonar-scanner \
          -Dsonar.host.url="$SONAR_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
          -Dsonar.projectName="$SONAR_PROJECT_NAME" \
          -Dsonar.sources=lib \
          -Dsonar.dart.lcov.reportPaths=coverage/lcov.info \
          -Dsonar.qualitygate.wait=false \
          -Dsonar.scm.disabled=true

        REPORT_TASK_FILE=".scannerwork/report-task.txt"
        [ -f "$REPORT_TASK_FILE" ] || { echo "Error: report-task.txt not found"; exit 1; }
        CE_TASK_ID=$(grep -oP '^ceTaskId=\K.*' "$REPORT_TASK_FILE")

        CE_STATUS="PENDING"
        for i in $(seq 1 40); do
          curl -s -u "${SONAR_TOKEN}:" "${SONAR_URL}/api/ce/task?id=${CE_TASK_ID}" -o /tmp/ce_task.json || echo '{}' > /tmp/ce_task.json
          CE_STATUS=$(node -e "
            try { const d=JSON.parse(require('fs').readFileSync('/tmp/ce_task.json','utf8'));
            console.log((d.task&&d.task.status)||''); } catch(e){console.log('');}
          ")
          echo "Attempt $i: $CE_STATUS"
          [ "$CE_STATUS" = "SUCCESS" ] || [ "$CE_STATUS" = "FAILED" ] || [ "$CE_STATUS" = "CANCELED" ] && break
          sleep 5
        done

        [ "$CE_STATUS" = "SUCCESS" ] || { echo "Analysis did not finish (${CE_STATUS:-TIMEOUT})"; exit 1; }

        ANALYSIS_ID=$(node -e "
          const d=JSON.parse(require('fs').readFileSync('/tmp/ce_task.json','utf8'));
          console.log((d.task&&d.task.analysisId)||'');
        ")

        curl -s -u "${SONAR_TOKEN}:" \
          "${SONAR_URL}/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}" \
          -o /tmp/quality_gate.json || echo '{}' > /tmp/quality_gate.json

        STATUS=$(node -e "
          try { const d=JSON.parse(require('fs').readFileSync('/tmp/quality_gate.json','utf8'));
          console.log((d.projectStatus&&d.projectStatus.status)||''); } catch(e){console.log('');}
        ")
        STATUS=${STATUS:-UNKNOWN}

        curl -s -u "${SONAR_TOKEN}:" \
          "${SONAR_URL}/api/measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=coverage,new_coverage,bugs,vulnerabilities,code_smells,new_bugs,new_vulnerabilities,new_code_smells" \
          -o /tmp/metrics.json || echo '{}' > /tmp/metrics.json

        node -e "
          try {
            const data=JSON.parse(require('fs').readFileSync('/tmp/metrics.json','utf8'));
            const m=(data.component&&data.component.measures)||[];
            const get=k=>{const f=m.find(x=>x.metric===k);if(!f)return 'N/A';return f.value!==undefined?f.value:(f.period&&f.period.value!==undefined?f.period.value:'N/A');};
            ['coverage','new_coverage','bugs','vulnerabilities','code_smells','new_bugs','new_vulnerabilities','new_code_smells']
              .forEach(k=>console.log(k.toUpperCase()+'='+get(k)));
          } catch(e) { console.log('COVERAGE=N/A\nNEW_COVERAGE=N/A\nBUGS=N/A\nVULNERABILITIES=N/A\nCODE_SMELLS=N/A\nNEW_BUGS=N/A\nNEW_VULNERABILITIES=N/A\nNEW_CODE_SMELLS=N/A'); }
        " > /tmp/sonar_metrics.env
        source /tmp/sonar_metrics.env

        if [ "$STATUS" = "OK" ]; then EMOJI="✅"; else EMOJI="❌"; fi

        if [ -n "$CI_MERGE_REQUEST_IID" ]; then
          COMMENT="${EMOJI} **SonarQube Quality Gate: ${STATUS}**
        - Branch: ${CI_COMMIT_REF_NAME}
        - Coverage (project): ${COVERAGE}% | This MR: ${NEW_COVERAGE}%
        - Bugs: ${BUGS} (new: ${NEW_BUGS})
        - Vulnerabilities: ${VULNERABILITIES} (new: ${NEW_VULNERABILITIES})
        - Code Smells: ${CODE_SMELLS} (new: ${NEW_CODE_SMELLS})
        [View SonarQube](${SONAR_URL}/dashboard?id=${SONAR_PROJECT_KEY})
        Triggered by: ${GITLAB_USER_NAME}"
          curl -s -o /dev/null --insecure --request POST \
            --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            --data-urlencode "body=${COMMENT}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
        fi

        CHAT_TEXT="${EMOJI} *SonarQube: ${STATUS}* | *${CI_PROJECT_NAME}* | Branch: ${CI_COMMIT_REF_NAME} | MR: !${CI_MERGE_REQUEST_IID:-N/A}
        📊 Coverage: ${COVERAGE}% (MR: ${NEW_COVERAGE}%) | 🐛 Bugs: ${BUGS} (new: ${NEW_BUGS}) | 👤 ${GITLAB_USER_NAME}"
        curl -s -X POST -H "Content-Type: application/json" \
          -d "$(node -e "console.log(JSON.stringify({text:process.argv[1]}))" "$CHAT_TEXT")" \
          "$SONAR_GOOGLE_CHAT_WEBHOOK_URL" || true

        if [ "$STATUS" != "OK" ]; then
          send_notification "SonarQube Failed" "Quality Gate failed! Fix before merge 🚫"
          exit 1
        fi
      EOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_APPROVED != "true"'
      when: on_success
    - when: never
  tags:
    - dev

# ════════════════════════════════════════════════════
# DEV BRANCH এ PUSH হলে (merge পরে)
# Flutter Web build → Harbor → ArgoCD → Preview URL
# APK বানানো হবে না — concurrent merge সমস্যা নেই
# ════════════════════════════════════════════════════

build-web-preview:
  stage: build
  image: registry.cloudaes.com/base-images/aes-docker:24.0.5-cli
  services:
    - docker:24.0.5-dind
  resource_group: android-dev
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || true
        }

        IMAGE_NAME="registry.cloudaes.com/android-app/android-app-web-preview"
        # dev branch এ always "latest" tag — concurrent merge problem নেই
        IMAGE_TAG="dev-latest"

        echo "$harborpass" | docker login registry.cloudaes.com -u "$harboruser" --password-stdin \
          || { send_notification "Build Failure" "Docker login failed 😱"; exit 1; }

        # Flutter web build + nginx image একসাথে
        docker build \
          --build-arg BUILD_TARGET=web \
          --build-arg DART_ENV=dev \
          -t "$IMAGE_NAME:$IMAGE_TAG" . \
          || { send_notification "Build Failure" "Web preview build failed 🔨"; exit 1; }

        docker push "$IMAGE_NAME:$IMAGE_TAG" \
          || { send_notification "Build Failure" "Harbor push failed 🛑"; exit 1; }

        docker rmi "$IMAGE_NAME:$IMAGE_TAG" || true

        send_notification "Build Success" "Web preview image pushed, deploying... 🚀"
      EOF
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "dev"'
      when: always
    - when: never
  tags:
    - dev

update-manifest:
  stage: deploy
  image: registry.cloudaes.com/base-images/aes-git:v1.0.2
  resource_group: android-dev
  needs: ['build-web-preview']
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || true
        }

        IMAGE_TAG="dev-latest"

        git clone --branch dev "https://${gituser}:${gitpass}@172.17.19.247/devops/bmd-manifests.git" \
          || { send_notification "Deploy Failure" "Git clone failed 🛑"; exit 1; }

        cd bmd-manifests

        # android app preview manifest file
        sed -i "s|image: registry.cloudaes.com/android-app/android-app-web-preview:.*|image: registry.cloudaes.com/android-app/android-app-web-preview:${IMAGE_TAG}|" \
          k8s/android-preview.yaml \
          || { send_notification "Deploy Failure" "Manifest update failed 🙈"; exit 1; }

        git add k8s/android-preview.yaml
        git commit -m "Update android web preview image to ${IMAGE_TAG} [pipeline: ${CI_PIPELINE_IID}]" \
          || { send_notification "Deploy Failure" "Git commit failed 🔁"; exit 1; }

        git push origin dev \
          || { send_notification "Deploy Failure" "Git push failed 🔨"; exit 1; }

        send_notification "Deploy Success" "Manifest updated, triggering ArgoCD 🎉"
      EOF
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "dev"'
      when: always
    - when: never
  tags:
    - dev

trigger_argo:
  stage: trigger_argo
  image: registry.cloudaes.com/base-images/argocli:v2.6.15
  resource_group: android-dev
  needs: ['update-manifest']
  script:
    - APP="android-preview-dev-ns"
    - argocd login $dev_argo_url --username $argo_user --password $argo_pass --insecure
    - argocd app sync $APP
    - argocd app wait $APP
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "dev"'
      when: on_success
    - when: never
  tags:
    - dev

notify-success:
  stage: notify
  image: registry.cloudaes.com/base-images/aes-git:v1.0.2
  needs: ['trigger_argo']
  script:
    - |
      /bin/bash <<'EOF'
        # PREVIEW_URL হলো তোমার dev k8s এ এই app এর ingress URL
        PREVIEW_URL="https://android-preview.dev.yourcompany.com"

        CHAT_TEXT="🔧 *Android Dev Preview Ready!*

        *Project:* ${CI_PROJECT_NAME}
        *Branch:* ${CI_COMMIT_REF_NAME}
        *Pipeline:* #${CI_PIPELINE_IID}
        *Commit:* \`${CI_COMMIT_SHORT_SHA}\`
        *Author:* ${GITLAB_USER_NAME}
        *Message:* ${CI_COMMIT_MESSAGE}

        🌐 <${PREVIEW_URL}|Browser এ দেখুন (Web Preview)>

        ✅ Analyze  ✅ Test  ✅ SonarQube  ✅ Build  ✅ Deployed"

        curl -s -X POST -H "Content-Type: application/json" \
          -d "$(node -e "console.log(JSON.stringify({text:process.argv[1]}))" "$CHAT_TEXT")" \
          "$GOOGLE_CHAT_WEBHOOK_URL"
      EOF
  when: on_success
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "dev"'
      when: on_success
    - when: never
  tags:
    - dev

notify-failure:
  stage: notify
  image: registry.cloudaes.com/base-images/aes-git:v1.0.2
  script:
    - |
      /bin/bash <<'EOF'
        CHAT_TEXT="❌ *Android Dev Build Failed!*
        *Project:* ${CI_PROJECT_NAME} | *Branch:* ${CI_COMMIT_REF_NAME}
        *Pipeline:* #${CI_PIPELINE_IID} | *Author:* ${GITLAB_USER_NAME}
        🔗 <${CI_PIPELINE_URL}|Pipeline দেখুন>"
        curl -s -X POST -H "Content-Type: application/json" \
          -d "$(node -e "console.log(JSON.stringify({text:process.argv[1]}))" "$CHAT_TEXT")" \
          "$GOOGLE_CHAT_WEBHOOK_URL"
      EOF
  when: on_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "dev"'
      when: on_failure
    - when: never
  tags:
    - dev
stages:
  - analyze
  - test
  - sonar
  - build
  - deploy
  - notify



flutter-analyze:
  stage: analyze
  image: ghcr.io/cirruslabs/flutter:stable
  resource_group: android-qa-analyze
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || echo "Failed to send notification"
        }

        flutter pub get || { send_notification "Analyze Failure" "pub get failed 😱"; exit 1; }
        # flutter analyze || { send_notification "Analyze Failure" "Who broke the code? 🔍"; exit 1; }
        dart format --output=none --set-exit-if-changed . || { send_notification "Analyze Failure" "Format check failed 🧹"; exit 1; }
        dart format --check . || { send_notification "Analyze Failure" "Format check failed 🧹"; exit 1; }

        send_notification "Analyze Success" "Code analysis passed ✅"
      EOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_APPROVED != "true"'
      when: always
    - when: never
  tags:
    - qa

flutter-test:
  stage: test
  image: ghcr.io/cirruslabs/flutter:stable
  resource_group: android-qa-test
  needs: ['flutter-analyze']
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || echo "Failed to send notification"
        }

        flutter pub get
        flutter test --coverage || { send_notification "Test Failure" "Tests are failing! 🧪"; exit 1; }

        send_notification "Test Success" "All tests passed ✅"
      EOF
  artifacts:
    paths:
      - coverage/lcov.info
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_APPROVED != "true"'
      when: always
    - when: never
  tags:
    - qa

sonarqube-report:
  stage: sonar
  image: registry.cloudaes.com/base-images/sonar-node24:v1
  resource_group: android-qa-sonar
  needs: ['flutter-test']
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || echo "Failed to send notification"
        }

        export SONAR_PROJECT_KEY=android-app-qa
        export SONAR_PROJECT_NAME="Android App QA"

        git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-qa}" --depth=100 || \
          git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-qa}" --unshallow || true

        sonar-scanner \
          -Dsonar.host.url="$SONAR_URL" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
          -Dsonar.projectName="$SONAR_PROJECT_NAME" \
          -Dsonar.sources=lib \
          -Dsonar.dart.lcov.reportPaths=coverage/lcov.info \
          -Dsonar.qualitygate.wait=false \
          -Dsonar.scm.disabled=true

        REPORT_TASK_FILE=".scannerwork/report-task.txt"
        [ -f "$REPORT_TASK_FILE" ] || { echo "Error: report-task.txt not found"; exit 1; }
        CE_TASK_ID=$(grep -oP '^ceTaskId=\K.*' "$REPORT_TASK_FILE")
        [ -n "$CE_TASK_ID" ] || { echo "Error: could not read ceTaskId"; exit 1; }

        CE_STATUS="PENDING"
        for i in $(seq 1 40); do
          curl -s -u "${SONAR_TOKEN}:" \
            "${SONAR_URL}/api/ce/task?id=${CE_TASK_ID}" \
            -o /tmp/ce_task.json || echo '{}' > /tmp/ce_task.json
          CE_STATUS=$(node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync('/tmp/ce_task.json', 'utf8'));
              console.log((d.task && d.task.status) || '');
            } catch(e) { console.log(''); }
          ")
          echo "Attempt $i: CE status = $CE_STATUS"
          [ "$CE_STATUS" = "SUCCESS" ] || [ "$CE_STATUS" = "FAILED" ] || [ "$CE_STATUS" = "CANCELED" ] && break
          sleep 5
        done

        [ "$CE_STATUS" = "SUCCESS" ] || { echo "Analysis did not finish (${CE_STATUS:-TIMEOUT})"; exit 1; }

        ANALYSIS_ID=$(node -e "
          const d = JSON.parse(require('fs').readFileSync('/tmp/ce_task.json', 'utf8'));
          console.log((d.task && d.task.analysisId) || '');
        ")

        curl -s -u "${SONAR_TOKEN}:" \
          "${SONAR_URL}/api/qualitygates/project_status?analysisId=${ANALYSIS_ID}" \
          -o /tmp/quality_gate.json || echo '{}' > /tmp/quality_gate.json

        STATUS=$(node -e "
          try {
            const d = JSON.parse(require('fs').readFileSync('/tmp/quality_gate.json', 'utf8'));
            console.log((d.projectStatus && d.projectStatus.status) || '');
          } catch(e) { console.log(''); }
        ")
        STATUS=${STATUS:-UNKNOWN}

        curl -s -u "${SONAR_TOKEN}:" \
          "${SONAR_URL}/api/measures/component?component=${SONAR_PROJECT_KEY}&metricKeys=coverage,new_coverage,bugs,vulnerabilities,code_smells,new_bugs,new_vulnerabilities,new_code_smells" \
          -o /tmp/metrics.json || echo '{}' > /tmp/metrics.json

        node -e "
          try {
            const data = JSON.parse(require('fs').readFileSync('/tmp/metrics.json', 'utf8'));
            const m = (data.component && data.component.measures) || [];
            const get = k => {
              const f = m.find(x => x.metric === k);
              if (!f) return 'N/A';
              return f.value !== undefined ? f.value : (f.period && f.period.value !== undefined ? f.period.value : 'N/A');
            };
            ['coverage','new_coverage','bugs','vulnerabilities','code_smells','new_bugs','new_vulnerabilities','new_code_smells']
              .forEach(k => console.log(k.toUpperCase() + '=' + get(k)));
          } catch(e) {
            console.log('COVERAGE=N/A\nNEW_COVERAGE=N/A\nBUGS=N/A\nVULNERABILITIES=N/A\nCODE_SMELLS=N/A\nNEW_BUGS=N/A\nNEW_VULNERABILITIES=N/A\nNEW_CODE_SMELLS=N/A');
          }
        " > /tmp/sonar_metrics.env
        source /tmp/sonar_metrics.env

        if [ "$STATUS" = "OK" ]; then EMOJI="✅"; else EMOJI="❌"; fi

        if [ -n "$CI_MERGE_REQUEST_IID" ]; then
          COMMENT="${EMOJI} **SonarQube Quality Gate: ${STATUS}**
        - Branch: ${CI_COMMIT_REF_NAME}
        - Coverage (project): ${COVERAGE}% | This MR: ${NEW_COVERAGE}%
        - Bugs: ${BUGS} (new: ${NEW_BUGS})
        - Vulnerabilities: ${VULNERABILITIES} (new: ${NEW_VULNERABILITIES})
        - Code Smells: ${CODE_SMELLS} (new: ${NEW_CODE_SMELLS})
        [View SonarQube Dashboard](${SONAR_URL}/dashboard?id=${SONAR_PROJECT_KEY})
        Triggered by: ${GITLAB_USER_NAME} (@${GITLAB_USER_LOGIN})"

          curl -s -o /dev/null --insecure \
            --request POST \
            --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
            --data-urlencode "body=${COMMENT}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
        fi

        CHAT_TEXT="${EMOJI} *SonarQube Quality Gate: ${STATUS}*
        *Project:* ${CI_PROJECT_NAME}
        *Branch:* ${CI_COMMIT_REF_NAME}
        *MR:* !${CI_MERGE_REQUEST_IID:-N/A}
        📊 Coverage: ${COVERAGE}% (MR: ${NEW_COVERAGE}%)
        🐛 Bugs: ${BUGS} (new: ${NEW_BUGS})
        🔒 Vulnerabilities: ${VULNERABILITIES} (new: ${NEW_VULNERABILITIES})
        🔧 Code Smells: ${CODE_SMELLS} (new: ${NEW_CODE_SMELLS})
        👤 Triggered by: ${GITLAB_USER_NAME}
        🔗 <${SONAR_URL}/dashboard?id=${SONAR_PROJECT_KEY}|SonarQube Dashboard>"
        curl -s -X POST -H "Content-Type: application/json" \
          -d "$(node -e "console.log(JSON.stringify({text: process.argv[1]}))" "$CHAT_TEXT")" \
          "$SONAR_GOOGLE_CHAT_WEBHOOK_URL" || echo "Chat notify failed"

        if [ "$STATUS" != "OK" ]; then
          send_notification "SonarQube Failed" "Quality Gate failed! Fix before merge 🚫"
          exit 1
        fi
      EOF
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_APPROVED != "true"'
      when: on_success
    - when: never
  tags:
    - qa

# ════════════════════════════════════════════════════════════
# QA BRANCH এ PUSH হলে (merge পরে)
# APK Build + Sign → GitLab Artifacts + Nexus → Google Chat
# ════════════════════════════════════════════════════════════

build-apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  resource_group: android-qa
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || echo "Failed to send notification"
        }

        MR_IID=$(git log -1 --pretty=%B | grep -oP 'See merge request .*!\K\d+')
        APK_TAG="$(date +'%d%b')-mr${MR_IID}-b${CI_PIPELINE_IID}"
        export APK_TAG

        [ -n "$APK_TAG" ] || { send_notification "Build Failure" "APK tag empty 😱"; exit 1; }

        # Keystore inject
        echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks \
          || { send_notification "Build Failure" "Keystore inject failed 🔑"; exit 1; }

        # Version set
        sed -i "s/^version:.*/version: 1.0.0+${CI_PIPELINE_IID}/" pubspec.yaml

        flutter pub get || { send_notification "Build Failure" "pub get failed 😱"; exit 1; }

        flutter build apk --release \
          --dart-define=ENV=qa \
          || { send_notification "Build Failure" "APK build failed 🔨"; exit 1; }

        # APK rename with version tag
        mv build/app/outputs/apk/release/app-release.apk \
           build/app/outputs/apk/release/android-app-qa-${APK_TAG}.apk

        echo "APK_TAG=${APK_TAG}" > /tmp/apk_info.env

        send_notification "Build Success" "APK built, uploading... 📦"
      EOF
  artifacts:
    paths:
      - build/app/outputs/apk/release/android-app-qa-*.apk
    reports:
      dotenv: /tmp/apk_info.env
    expire_in: 30 days
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "qa"'
      when: always
    - when: never
  tags:
    - qa

upload-nexus:
  stage: deploy
  image: registry.cloudaes.com/base-images/aes-git:v1.0.2
  resource_group: android-qa
  needs: ['build-apk']
  script:
    - |
      /bin/bash <<'EOF'
        set -x
        set -e

        send_notification() {
          local payload="{\"text\": \"[$CI_PROJECT_NAME][$CI_COMMIT_REF_NAME][$1] $2 - Job: $CI_JOB_NAME\"}"
          curl -s -X POST -H "Content-Type: application/json" -d "$payload" "$GOOGLE_CHAT_WEBHOOK_URL" || echo "Failed to send notification"
        }

        APK_FILE=$(ls build/app/outputs/apk/release/android-app-qa-*.apk | head -1)
        APK_FILENAME=$(basename "$APK_FILE")
        NEXUS_REPO="${NEXUS_URL}/repository/android-apk-qa"

        # Versioned copy রাখো
        curl -u "$NEXUS_USER:$NEXUS_PASSWORD" \
          --upload-file "$APK_FILE" \
          "${NEXUS_REPO}/${APK_FILENAME}" \
          || { send_notification "Deploy Failure" "Nexus versioned upload failed 🛑"; exit 1; }

        # Latest overwrite করো
        curl -u "$NEXUS_USER:$NEXUS_PASSWORD" \
          --upload-file "$APK_FILE" \
          "${NEXUS_REPO}/android-app-qa-latest.apk" \
          || { send_notification "Deploy Failure" "Nexus latest update failed 🛑"; exit 1; }

        GITLAB_ARTIFACT_URL="${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/build/app/outputs/apk/release/${APK_FILENAME}"

        echo "APK_NEXUS_URL=${NEXUS_REPO}/${APK_FILENAME}" >> /tmp/apk_info.env
        echo "APK_NEXUS_LATEST_URL=${NEXUS_REPO}/android-app-qa-latest.apk" >> /tmp/apk_info.env
        echo "APK_GITLAB_URL=${GITLAB_ARTIFACT_URL}" >> /tmp/apk_info.env

        send_notification "Upload Success" "APK uploaded! Notifying QA team 🎉"
      EOF
  artifacts:
    reports:
      dotenv: /tmp/apk_info.env
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "qa"'
      when: always
    - when: never
  tags:
    - qa

notify-success:
  stage: notify
  image: registry.cloudaes.com/base-images/aes-git:v1.0.2
  needs: ['upload-nexus']
  script:
    - |
      /bin/bash <<'EOF'
        CHAT_TEXT="🧪 *New Android Build Ready — QA Team*

        *Project:* ${CI_PROJECT_NAME}
        *Branch:* ${CI_COMMIT_REF_NAME}
        *Build No:* #${CI_PIPELINE_IID}
        *Version:* ${APK_TAG}
        *Commit:* \`${CI_COMMIT_SHORT_SHA}\`
        *Author:* ${GITLAB_USER_NAME}
        *Message:* ${CI_COMMIT_MESSAGE}

        📦 <${APK_NEXUS_URL}|এই Build Download করুন (Nexus)>
        📦 <${APK_NEXUS_LATEST_URL}|সবসময় Latest APK (Nexus)>
        📦 <${APK_GITLAB_URL}|এই Build Download করুন (GitLab)>

        ✅ Analyze  ✅ Test  ✅ SonarQube  ✅ Build  ✅ Uploaded"

        curl -s -X POST -H "Content-Type: application/json" \
          -d "$(node -e "console.log(JSON.stringify({text: process.argv[1]}))" "$CHAT_TEXT")" \
          "$GOOGLE_CHAT_WEBHOOK_URL"
      EOF
  when: on_success
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "qa"'
      when: on_success
    - when: never
  tags:
    - qa

notify-failure:
  stage: notify
  image: registry.cloudaes.com/base-images/aes-git:v1.0.2
  script:
    - |
      /bin/bash <<'EOF'
        CHAT_TEXT="❌ *Android QA Build Failed!*

        *Project:* ${CI_PROJECT_NAME}
        *Branch:* ${CI_COMMIT_REF_NAME}
        *Pipeline:* #${CI_PIPELINE_IID}
        *Author:* ${GITLAB_USER_NAME}

        🔗 <${CI_PIPELINE_URL}|Pipeline দেখুন>"

        curl -s -X POST -H "Content-Type: application/json" \
          -d "$(node -e "console.log(JSON.stringify({text: process.argv[1]}))" "$CHAT_TEXT")" \
          "$GOOGLE_CHAT_WEBHOOK_URL"
      EOF
  when: on_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_NAME == "qa"'
      when: on_failure
    - when: never
  tags:
    - qa